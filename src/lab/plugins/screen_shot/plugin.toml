[plugin]
id = "screen_shot"
name = "Screen Shot"
version = "0.1.0"
type = "tool"
description = "捕获当前桌面截图并返回 base64 编码 JPEG，无显示器环境自动跳过注册"
author = "XnneHangLab"
source = "builtin"

[config]
enable_ocr = false
ocr_threads = 2

[config_schema.enable_ocr]
type = "bool"
description = "注册独立的按需屏幕 OCR 工具；截图不等待 OCR"

[config_schema.ocr_threads]
type = "int"
description = "按需 OCR 的 ONNX 线程数，避免默认占满 CPU"
min = 1
max = 32

[type_config]
entry = "ScreenShotPlugin"
