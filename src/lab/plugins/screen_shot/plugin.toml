[plugin]
id = "screen_shot"
name = "Screen Shot"
version = "0.1.0"
type = "tool"
description = "读取已记录的屏幕关键帧，并提供可选的独立 OCR"
author = "XnneHangLab"
source = "builtin"

[config]
enable_ocr = false
ocr_threads = 2

[config_schema.enable_ocr]
type = "bool"
description = "注册独立的按需屏幕 OCR 工具；截图不等待 OCR"

[config_schema.ocr_threads]
type = "int"
description = "按需 OCR 的 ONNX 线程数，避免默认占满 CPU"
min = 1
max = 32

[type_config]
entry = "ScreenShotPlugin"
