[plugin]
id = "mood_chat"
name = "Mood Chat"
version = "0.1.0"
type = "hook"
description = "心情驱动的主动对话调度器"
author = "XnneHangLab"
source = "builtin"

[config]
prompt = "请根据上下文，主动说些什么。"
initial_mood = 80
target_mood = 80
response_timeout_s = 10.0
interval_excited_s = 5.0
interval_normal_s = 30.0
interval_low_s = 120.0
mood_increase = 5
mood_decrease = 10

[config_schema.prompt]
type = "str"
description = "主动对话时发送给 agent 的提示词"

[config_schema.initial_mood]
type = "int"
description = "启动后的初始心情分"
min = 0
max = 100

[config_schema.target_mood]
type = "int"
description = "心情自然回归的目标分数"
min = 0
max = 100

[config_schema.response_timeout_s]
type = "float"
description = "主动发言后等待用户回应的超时时间（秒）"
min = 0.0

[config_schema.interval_excited_s]
type = "float"
description = "心情 >= 90 时的主动发言间隔（秒）"
min = 0.0

[config_schema.interval_normal_s]
type = "float"
description = "心情 >= 80 时的主动发言间隔（秒）"
min = 0.0

[config_schema.interval_low_s]
type = "float"
description = "心情 >= 60 时的主动发言间隔（秒）"
min = 0.0

[config_schema.mood_increase]
type = "int"
description = "用户发言后增加的心情分"
min = 0
max = 100

[config_schema.mood_decrease]
type = "int"
description = "主动发言后超时未回应时扣除的心情分"
min = 0
max = 100

[type_config]
entry = "MoodChatPlugin"
